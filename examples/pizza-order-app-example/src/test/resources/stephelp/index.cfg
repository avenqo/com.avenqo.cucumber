# --- Exact matches ---
the coffee machine is switched on=machine_on.html
today is Tuesday=tuesday_normal.html
today is Monday=monday_grumpy.html
I order a cappuccino=order_cappuccino.html
I order an espresso=order_espresso.html
the machine should serve a cappuccino=serve_cappuccino.html
the machine should refuse the order=refuse_order.html
the machine should display "Nope. It's Monday."=monday_nope.html

# --- Normalized (fun) matches ---
# Given   TODAY   is   tuesday=tuesday_normalized.html
# when i    order      a     cappuccino=order_cappuccino_normalized.html

# --- Prefix matches ---
# Given today=given_today_prefix.html
# When I order=order_prefix.html

# --- Regex matches ---
regex:^.*wonderful.*$=wonderful_regex.html
regex:^.*weekend.*$=weekend_regex.html
regex:^.*offline.*$=offline_regex.html

# --- Fallback joke ---
regex:^.*coffee.*machine.*$=coffee_machine_generic.html
